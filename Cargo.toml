[package]
name = "mtg-tui"
version = "0.3.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json", "tls"] }
jpeg-decoder = "0.3"
base64 = "0.22"
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
